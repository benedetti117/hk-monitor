<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>监控站</title>
<style>
html,body{margin:0;height:100%}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,"Microsoft YaHei",sans-serif}
header{position:fixed;top:0;left:0;right:0;height:52px;background:#0d1117;border-bottom:1px solid #30363d;
display:flex;align-items:stretch;gap:6px;padding:0 12px;overflow-x:auto;z-index:9}
.brand{display:flex;align-items:center;font-weight:600;font-size:15px;margin-right:8px;white-space:nowrap}
.tab{border:none;background:none;color:#8b949e;font-size:14px;font-family:inherit;cursor:pointer;
padding:6px 14px;border-radius:8px;margin:8px 0;display:flex;flex-direction:column;justify-content:center;
line-height:1.35;white-space:nowrap}
.tab:hover{color:#e6edf3;background:#161b22}
.tab.active{color:#e6edf3;background:#161b22}
.tab .ts{font-size:10px;color:#6e7681}
.hint{display:flex;align-items:center;margin-left:auto;font-size:11px;color:#6e7681;white-space:nowrap;padding-right:4px}
.frame{border:none;width:100%;height:calc(100vh - 52px);margin-top:52px;display:none;background:#fff}
.frame.active{display:block}
</style>
</head>
<body>
<header>
<span class="brand">监控站</span>
<button class="tab active" data-f="review.html" title="复盘报告+邮件纪要合成阅读页">每日复盘<span class="ts">10-09 07:50</span></button>
<button class="tab" data-f="southbound.html" title="17项指标+洋葱策略信号">南向资金看板<span class="ts">10-09 07:20</span></button>
<button class="tab" data-f="ann.html" title="自选股披露易最新公告">最新公告<span class="ts">10-09 09:35</span></button>
<button class="tab" data-f="di.html" title="自选股披露权益变动每日提示">披露权益监控<span class="ts">10-09 07:16</span></button>
<button class="tab" data-f="short.html" title="港股自选池每日沽空占比+趋势图">沽空监控<span class="ts">10-09 07:10</span></button>
<button class="tab" data-f="bb.html" title="自选股回购公告速览(SRRPT)">回购速览<span class="ts">10-09 09:35</span></button>
<button class="tab" data-f="unlock.html" title="港股解禁日期/金额/占比/股东,可排序+在线刷新价格">解禁日程<span class="ts">10-05 20:14</span></button>
<span class="hint">每日 09:45 自动更新 · 仅供个人研究</span>
</header>
<main>
<iframe id="frame-review.html" class="frame active" src="review.html"></iframe>
<iframe id="frame-southbound.html" class="frame" data-src="southbound.html"></iframe>
<iframe id="frame-ann.html" class="frame" data-src="ann.html"></iframe>
<iframe id="frame-di.html" class="frame" data-src="di.html"></iframe>
<iframe id="frame-short.html" class="frame" data-src="short.html"></iframe>
<iframe id="frame-bb.html" class="frame" data-src="bb.html"></iframe>
<iframe id="frame-unlock.html" class="frame" data-src="unlock.html"></iframe>
</main>
<script>
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
    document.querySelectorAll('.frame').forEach(function(x){x.classList.remove('active')});
    t.classList.add('active');
    var f = document.getElementById('frame-' + t.dataset.f);
    var lazy = f.getAttribute('data-src');
    if (lazy) { f.src = lazy; f.removeAttribute('data-src'); }
    f.classList.add('active');
  });
});
</script>
</body>
</html>
